    networks: [purechain-rehearsal]

  poa2-node6:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE6_TAG:-old}
    container_name: rehearsal-poa2-node6
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while true; do
          geth attach --preload /scripts/poa2.js /data/geth.ipc
          sleep 5
        done
    volumes: ["./data/node6:/data", "./scripts:/scripts:ro"]
    networks: [purechain-rehearsal]

  automine-node5:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE5_TAG:-old}
    container_name: rehearsal-automine-node5
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while true; do
          geth attach --preload /scripts/autoMine-v2.js /data/geth.ipc
          sleep 5
        done
    volumes: ["./data/node5:/data", "./scripts:/scripts:ro"]
    networks: [purechain-rehearsal]

  automine-node6:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE6_TAG:-old}
    container_name: rehearsal-automine-node6
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while true; do
          geth attach --preload /scripts/autoMine-v2.js /data/geth.ipc
          sleep 5
        done
    volumes: ["./data/node6:/data", "./scripts:/scripts:ro"]
    networks: [purechain-rehearsal]

  # ---- referee: polls every node, records agreement/heads/mining, trips on
  # divergence. Started explicitly by the driver after bring-up. ----
  monitor:
    profiles: [tools]
    build: ./monitor
    image: purechain-rehearsal-monitor
    container_name: rehearsal-monitor
    restart: unless-stopped
    volumes:
      - ./artifacts:/artifacts
    networks: [purechain-rehearsal]

  # ---- load generator / functional test client. Never started by `up`;
  # the driver invokes one-shot commands via `docker compose run --rm loadgen ...` ----
  loadgen:
    profiles: [tools]
    build: ./loadgen
    image: purechain-rehearsal-loadgen
    volumes:
      - ./artifacts:/artifacts
      - ./scripts:/scripts
      - ./data:/hostdata
    networks: [purechain-rehearsal]

networks:
  purechain-rehearsal:
    driver: bridge
