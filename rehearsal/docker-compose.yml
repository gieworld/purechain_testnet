      - "--miner.gasprice=0"
      - "--gpo.ignoreprice=0"
      - "--gpo.maxprice=1000000000"
      - "--gpo.percentile=0"
      - "--txpool.pricelimit=0"
      - "--cache=256"
      - "--maxpeers=25"
      - "--unlock=0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc"
      - "--password=/run/secrets/signer.pw"
      - "--miner.recommit=${NODE3_RECOMMIT:-2s}"
      - "--identity=Rehearsal-Validator-3"
    volumes:
      - ./data/node3:/data
      - ./scripts:/scripts:ro
      - ./secrets/signer.pw:/run/secrets/signer.pw:ro
    networks: [purechain-rehearsal]
    stop_grace_period: 2m
    stop_signal: SIGINT
    healthcheck:
      test: "geth attach --exec eth.blockNumber /data/geth.ipc || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3

  node4:
    image: purechain-rehearsal:${NODE4_TAG:-old}
    container_name: rehearsal-node4
    hostname: node4
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    command:
      - "--datadir=/data"
      - "--networkid=424242"
      - "--rpc.enabledeprecatedpersonal"
      - "--syncmode=full"
      - "--allow-insecure-unlock"
      - "--port=30303"
      - "--authrpc.port=8551"
      - "--authrpc.addr=0.0.0.0"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=txpool,miner,admin,eth,web3,debug,personal,net,clique"
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - "--nodiscover"
