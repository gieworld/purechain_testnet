      interval: 30s
      timeout: 10s
      retries: 3

  node5:
    image: purechain-rehearsal:${NODE5_TAG:-old}
    container_name: rehearsal-node5
    hostname: node5
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    command:
      - "--datadir=/data"
      - "--networkid=424242"
      - "--syncmode=full"
      - "--port=30303"
      - "--authrpc.port=8551"
      - "--authrpc.addr=0.0.0.0"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=eth,net,web3"
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - "--nodiscover"
      - "--snapshot=false"
      - "--gcmode=archive"
      - "--miner.gasprice=0"
      - "--gpo.ignoreprice=0"
      - "--gpo.maxprice=1000000000"
      - "--gpo.percentile=0"
      - "--txpool.pricelimit=0"
      - "--cache=256"
      - "--maxpeers=25"
      - "--identity=Rehearsal-Idle-1"
      # STANDBY VALIDATOR (PoA² phase). The key is unlocked but this node is
      # NOT in the genesis signer set, so it seals nothing until PoA² votes it
      # in. That is the whole point of a standby: already synced, already
      # unlocked, promotable without an operator touching it.
      - "--unlock=0x9965507d1a55bcc2695c58ba16fb37d819b0a4dc"
      - "--password=/run/secrets/signer.pw"
      - "--allow-insecure-unlock"
    volumes:
      - ./data/node5:/data
      - ./scripts:/scripts:ro
      - ./secrets/signer.pw:/run/secrets/signer.pw:ro
    networks: [purechain-rehearsal]
    stop_grace_period: 2m
    stop_signal: SIGINT
    healthcheck:
      test: "geth attach --exec eth.blockNumber /data/geth.ipc || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3

  node6:
    image: purechain-rehearsal:${NODE6_TAG:-old}
    container_name: rehearsal-node6
    hostname: node6
    restart: unless-stopped
    mem_limit: 1g
