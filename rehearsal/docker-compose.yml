      - "--syncmode=full"
      - "--port=30303"
      - "--authrpc.port=8551"
      - "--authrpc.addr=0.0.0.0"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=eth,net,web3"
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - "--nodiscover"
      - "--snapshot=false"
      - "--gcmode=archive"
      - "--miner.gasprice=0"
      - "--gpo.ignoreprice=0"
      - "--gpo.maxprice=1000000000"
      - "--gpo.percentile=0"
      - "--txpool.pricelimit=0"
      - "--cache=256"
      - "--maxpeers=25"
      - "--identity=Rehearsal-Idle-2"
      # STANDBY VALIDATOR (PoA² phase) — see node5.
      - "--unlock=0x976ea74026e726554db657fa54763abd0c3a0aa9"
      - "--password=/run/secrets/signer.pw"
      - "--allow-insecure-unlock"
    volumes:
      - ./data/node6:/data
      - ./scripts:/scripts:ro
      - ./secrets/signer.pw:/run/secrets/signer.pw:ro
    networks: [purechain-rehearsal]
    stop_grace_period: 2m
    stop_signal: SIGINT
    healthcheck:
      test: "geth attach --exec eth.blockNumber /data/geth.ipc || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- automine sidecars (verbatim prod mechanism: attach via the shared
  # datadir IPC, preload autoMine-v2.js, restart the attach loop forever) ----
  automine-node1:
    image: purechain-rehearsal:${NODE1_TAG:-old}
    container_name: rehearsal-automine-node1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          echo "Attaching to geth..."
          geth attach --preload /scripts/autoMine-v2.js /data/geth.ipc
          sleep 5
        done
    volumes:
      - ./data/node1:/data
      - ./scripts:/scripts:ro
    networks: [purechain-rehearsal]
    depends_on: [node1]

  automine-node2:
    image: purechain-rehearsal:${NODE2_TAG:-old}
    container_name: rehearsal-automine-node2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          echo "Attaching to geth..."
          geth attach --preload /scripts/autoMine-v2.js /data/geth.ipc
          sleep 5
        done
    volumes:
      - ./data/node2:/data
      - ./scripts:/scripts:ro
    networks: [purechain-rehearsal]
    depends_on: [node2]

  automine-node3:
    image: purechain-rehearsal:${NODE3_TAG:-old}
    container_name: rehearsal-automine-node3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          echo "Attaching to geth..."
          geth attach --preload /scripts/autoMine-v2.js /data/geth.ipc
          sleep 5
        done
    volumes:
      - ./data/node3:/data
      - ./scripts:/scripts:ro
    networks: [purechain-rehearsal]
    depends_on: [node3]

  automine-node4:
    image: purechain-rehearsal:${NODE4_TAG:-old}
    container_name: rehearsal-automine-node4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 30
        while true; do
          echo "Attaching to geth..."
          geth attach --preload /scripts/autoMine-v2.js /data/geth.ipc
          sleep 5
        done
    volumes:
      - ./data/node4:/data
      - ./scripts:/scripts:ro
    networks: [purechain-rehearsal]
    depends_on: [node4]

  # ---- PoA² sidecars (profile: poa2) --------------------------------------
  # One per VALIDATOR: clique.propose() is a local vote, so a proposal only
  # carries when a majority of signers independently reach the same verdict —
  # every validator has to be running the controller, with an identical pool.
  #
  # Plus sealing sidecars for the two STANDBYS, so a promoted standby starts
  # sealing on its own. Without them a vote would install a signer that never
  # seals: it still counts toward len(signers) and raises the recent-signer
  # bar, which is how automation can halt a chain it was meant to heal.
  poa2-node1:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE1_TAG:-old}
    container_name: rehearsal-poa2-node1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while true; do
          geth attach --preload /scripts/poa2.js /data/geth.ipc
          sleep 5
        done
    volumes: ["./data/node1:/data", "./scripts:/scripts:ro"]
    networks: [purechain-rehearsal]

  poa2-node2:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE2_TAG:-old}
    container_name: rehearsal-poa2-node2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while true; do
          geth attach --preload /scripts/poa2.js /data/geth.ipc
          sleep 5
        done
    volumes: ["./data/node2:/data", "./scripts:/scripts:ro"]
    networks: [purechain-rehearsal]

  poa2-node3:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE3_TAG:-old}
    container_name: rehearsal-poa2-node3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while true; do
          geth attach --preload /scripts/poa2.js /data/geth.ipc
          sleep 5
        done
    volumes: ["./data/node3:/data", "./scripts:/scripts:ro"]
    networks: [purechain-rehearsal]

  poa2-node4:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE4_TAG:-old}
    container_name: rehearsal-poa2-node4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        while true; do
          geth attach --preload /scripts/poa2.js /data/geth.ipc
          sleep 5
        done
    volumes: ["./data/node4:/data", "./scripts:/scripts:ro"]
    networks: [purechain-rehearsal]

  # Controllers on the STANDBYS too. A promoted standby that isn't running one
  # cannot vote, so the voting quorum erodes with every replacement — observed
  # in the rehearsal: after one heal only 2 of 4 signers could vote and the
  # next proposal could never carry.
  poa2-node5:
    profiles: [poa2]
    image: purechain-rehearsal:${NODE5_TAG:-old}
    container_name: rehearsal-poa2-node5
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
