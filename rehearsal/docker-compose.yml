      - "--gpo.percentile=0"
      - "--txpool.pricelimit=0"
      - "--cache=256"
      - "--maxpeers=25"
      - "--unlock=0x70997970c51812dc3a010c7d01b50e0d17dc79c8"
      - "--password=/run/secrets/signer.pw"
      - "--miner.recommit=${NODE2_RECOMMIT:-2s}"
