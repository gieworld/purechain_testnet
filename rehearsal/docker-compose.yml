# PureChain upgrade-rehearsal network.
#
# Mirrors an operating PureChain deployment:
#   - 6 geth nodes: node1-4 validators (no --mine; sealing is driven by the
#     automine sidecars), node5-6 public RPC ("Idle") nodes with the minimal
#     eth,net,web3 API, exactly as prod.
#   - 4 automine sidecars running the verbatim prod autoMine-v2.js via IPC.
#   - Same node profile as prod: full sync, archive gcmode, snapshot=false,
#     cache=256, 1g mem limit, SIGINT + 2m grace, restart unless-stopped,
#     --nodiscover with static addpeers loaded by the entrypoint.
#
# Deviations from prod, all deliberate:
#   - Test keys (hardhat accounts 0-3), never the prod signer keys.
#   - No --nat/--ethstats (no public IP, no dashboard; the monitor sidecar
#     records what ethstats would show).
#   - genesis gasLimit is 30M = prod's CURRENT effective limit (prod's genesis
#     started astronomically high and converged to the 30M miner target long
#     ago; today's behavior is what we rehearse).
#   - Per-node image tag (NODEx_TAG) + recommit (NODEx_RECOMMIT) are compose
#     variables (rehearsal/.env) so the driver can roll nodes between
#     binaries/configs ONE AT A TIME; prod achieves the same by rebuilding its
#     single shared image.
#
# The driver (drive.sh) owns bring-up ordering — prod brings nodes up
# sequentially with a consistency gate (see prod start_network.sh), so a plain
# `docker compose up -d` of everything at once is NOT the supported path.

services:
  node1:
    image: purechain-rehearsal:${NODE1_TAG:-old}
    container_name: rehearsal-node1
    hostname: node1
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    command:
      - "--datadir=/data"
      - "--networkid=424242"
      - "--rpc.enabledeprecatedpersonal"
      - "--syncmode=full"
      - "--allow-insecure-unlock"
      - "--port=30303"
      - "--authrpc.port=8551"
      - "--authrpc.addr=0.0.0.0"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=txpool,miner,admin,eth,web3,debug,personal,net,clique"
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - "--nodiscover"
      - "--snapshot=false"
      - "--gcmode=archive"
      - "--miner.gasprice=0"
      - "--gpo.ignoreprice=0"
      - "--gpo.maxprice=1000000000"
      - "--gpo.percentile=0"
      - "--txpool.pricelimit=0"
      - "--cache=256"
      - "--maxpeers=25"
      - "--unlock=0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
      - "--password=/run/secrets/signer.pw"
      - "--miner.recommit=${NODE1_RECOMMIT:-2s}"
      - "--identity=Rehearsal-Validator-1"
    volumes:
      - ./data/node1:/data
      - ./scripts:/scripts:ro
      - ./secrets/signer.pw:/run/secrets/signer.pw:ro
    networks: [purechain-rehearsal]
    stop_grace_period: 2m
    stop_signal: SIGINT
    healthcheck:
      test: "geth attach --exec eth.blockNumber /data/geth.ipc || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3

